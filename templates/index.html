<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Optimization Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        #promptInput {
            width: 80%; max-width: 600px; height: 150px;
            padding: 15px; border-radius: 10px;
            background-color: #1e293b; color: white;
            border: 1px solid #334155;
        }
        button {
            margin-top: 20px; padding: 12px 25px;
            background-color: #0ea5e9; color: white;
            border: none; border-radius: 5px; cursor: pointer;
        }
        #resultDisplay {
            margin-top: 30px; width: 80%; max-width: 600px;
            padding: 20px; background-color: #1e293b;
            border-left: 5px solid #38bdf8; white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Prompt Optimizer</h1>
    <textarea id="promptInput" placeholder="Enter your prompt..."></textarea>
    <button onclick="optimizePrompt()">Optimize Prompt</button>
    <div id="resultDisplay">Result will appear here...</div>

    <script>
        async function optimizePrompt() {
            const input = document.getElementById('promptInput').value;
            const display = document.getElementById('resultDisplay');
            
            display.innerText = "Optimizing..."; 

            // Asynchronous UX using fetch
            const response = await fetch('/optimize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: input })
            });

            const data = await response.json();
            display.innerText = data.optimized || data.error;
        }
    </script>
</body>
</html>
